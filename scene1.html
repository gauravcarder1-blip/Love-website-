<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scene 1 — Entrance</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body class="scene scene1">
  <noscript class="no-js-message">
    <div class="fallback">
      <h1>Offline Romantic Confession</h1>
      <p>For full experience, enable JavaScript. You can still view this message and press Play Offline.</p>
      <button onclick="document.querySelector('.audio-ctrl').classList.add('visible')">Play Offline</button>
    </div>
  </noscript>

  <div id="s1-root" class="root fullscreen" aria-live="polite">
    <video id="s1-bg-video" autoplay muted loop playsinline preload="auto" class="bg-video" aria-hidden="true">
      <source src="assets/bg-scene1.mp4" type="video/mp4">
      <!-- fallback to image if video missing -->
    </video>

    <div class="layer petals" aria-hidden="true"></div>
    <div class="layer bokeh" aria-hidden="true"></div>

    <main class="centerbox">
      <h1 class="headline type-animate" data-text="Hey... I have something to tell you 💕">Hey... I have something to tell you 💕</h1>
      <button id="start-btn" class="pulse btn-primary" aria-label="Click to begin">Click to Begin ❤️</button>
    </main>

    <div class="controls">
      <button id="mute-toggle" class="audio-ctrl" aria-pressed="false" aria-label="Mute / Unmute music">🔊</button>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
